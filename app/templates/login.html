<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Arbitrator</title><link rel="stylesheet" href="/static/site.css"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"></head><body style="background:#f3f6fb"><main class="content" style="max-width:500px;margin:9vh auto"><div class="eyebrow" style="text-align:center">SECURITY OPERATIONS</div><h1 class="login-product"><span class="brand-mark"><svg class="brand-icon" aria-hidden="true"><use href="/static/icons.svg#gavel"/></svg></span>Arbitrator</h1><p>Sign in with your assigned account.</p><section class="panel" style="margin-top:24px"><h2>Sign in</h2>{% if error %}<div class="alert error">{{error}}</div>{% endif %}<form method="post" action="/login" class="upload-form"><label>Username</label><input name="username" required autocomplete="username" autofocus><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button type="submit" class="button primary">Sign in</button></form></section><p class="helper">Need access? Contact your administrator.</p></main></body></html>
