{% extends 'base.html' %}{% block breadcrumb %}MY ACCOUNT / PASSWORD{% endblock %}{% block content %}<div class="heading"><h1>Change password</h1></div>{% if error %}<div class="alert error">{{error}}</div>{% endif %}<section class="panel" style="max-width:650px"><form method="post" action="/account/password" class="upload-form"><input type="hidden" name="csrf_token" value="{{request.state.csrf_token}}"><label>Current password</label><input type="password" name="previous" required autocomplete="current-password"><label>New password (12+ characters)</label><input type="password" name="password" minlength="12" required autocomplete="new-password"><label>Confirm new password</label><input type="password" name="confirm" minlength="12" required autocomplete="new-password"><button class="button primary">Change and sign out</button></form></section>{% endblock %}
