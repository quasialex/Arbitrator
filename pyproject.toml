[project]
name = "arbitrator-capstone"
version = "0.18.0"
description = "MSIT capstone: vulnerability management and risk governance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "regex>=2024.0",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=43,<51",
  "httpx>=0.27,<1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.setuptools]
packages = ["app", "scripts"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.svg"]
